<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiBa Tracker - Autentikasi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-wrapper">
      
      <div class="auth-header">
        <div class="brand" style="justify-content: center; margin-bottom: 12px;">
          <div class="brand-icon">B</div>
          <span class="brand-title">BiBa Tracker</span>
        </div>
        <h1 id="auth-heading">Masuk ke Akun</h1>
        <p id="auth-subheading">Pantau kebiasaan dan perkembangan harian Anda</p>
      </div>

      <div class="card">
        <!-- Segmented Tab Switcher -->
        <div class="tabs-segmented">
          <button id="tab-btn-login" class="tab-btn active" onclick="switchAuthTab('login')">Masuk</button>
          <button id="tab-btn-register" class="tab-btn" onclick="switchAuthTab('register')">Daftar Akun</button>
        </div>

        <!-- Alert Notification -->
        <div id="alert-box" class="alert-box"></div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
          <!-- Username field (only shown for register) -->
          <div id="group-username" class="form-group hidden">
            <label for="input-username">Username</label>
            <input type="text" id="input-username" class="input" placeholder="bagas_dev" autocomplete="username">
          </div>

          <div class="form-group">
            <label for="input-email">Email</label>
            <input type="email" id="input-email" class="input" placeholder="nama@domain.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="input-password">Password</label>
            <input type="password" id="input-password" class="input" placeholder="Minimal 6 karakter" required autocomplete="current-password">
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 6px;">
            Masuk
          </button>
        </form>
      </div>

      <p style="text-align: center; font-size: 11px; color: var(--muted); margin-top: 16px;">
        Habit Tracker BiBa &middot; Local Server
      </p>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
